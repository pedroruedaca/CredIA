# Applies new SQL migrations (supabase/migrations/) to the live Supabase project when they reach main.
# Same command as by hand (`supabase db push`), so the migration history stays in step with the files.
#
# Needs one repository secret (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL  the session pooler connection string, with the database password in it:
#                    Supabase dashboard → Connect → Session pooler, e.g.
#                    postgresql://postgres.<project-ref>:<password>@aws-…-eu-west-1.pooler.supabase.com:5432/postgres
#                    (percent-encode any special characters in the password). The session pooler, not the direct
#                    connection: the direct host is IPv6-only and GitHub's runners have no IPv6.
# No Supabase access token: nothing here calls the management API, so there is no token to expire.
name: Supabase migrations

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch: # run by hand from the Actions tab (e.g. after changing the secret)

# One run at a time; a newer push waits instead of racing the previous one.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Check secret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL repository secret (Supabase → Connect → Session pooler connection string, with the password)."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::SUPABASE_DB_URL must start with postgresql:// (the Session pooler connection string)."; exit 1 ;;
          esac

      # Local vs remote history, and what would be applied: visible in the run log before anything changes.
      - name: Migration history
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Dry run
        run: supabase db push --dry-run --db-url "$SUPABASE_DB_URL"

      # No --include-all: if a migration older than the latest applied one is pending, this fails and a person looks.
      - name: Apply
        run: supabase db push --yes --db-url "$SUPABASE_DB_URL"
