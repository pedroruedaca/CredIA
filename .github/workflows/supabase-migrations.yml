# Applies new SQL migrations (supabase/migrations/) to the live Supabase project when they reach main.
# Same command as by hand (`supabase db push`), so the migration history stays in step with the files.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token (Supabase dashboard → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   the project's database password (Project Settings → Database)
name: Supabase migrations

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch: # run by hand from the Actions tab (e.g. after adding the secrets)

# One run at a time; a newer push waits instead of racing the previous one.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: fzdibpuamqimumdjotcx
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets."
            exit 1
          fi

      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # Local vs remote history, and what would be applied: visible in the run log before anything changes.
      - name: Migration history
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"

      - name: Dry run
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      # No --include-all: if a migration older than the latest applied one is pending, this fails and a person looks.
      - name: Apply
        run: supabase db push --yes --password "$SUPABASE_DB_PASSWORD"
